services:
  - type: web
    name: student-dashboard-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_PATH
        value: ./database/student_dashboard.db
      # Set CORS_ORIGIN to your Vercel frontend URL after deploying, e.g.:
      # https://student-dashboard-xyz.vercel.app
      - key: CORS_ORIGIN
        sync: false
