<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- White rounded background card -->
  <rect width="120" height="120" rx="16" fill="#ffffff"/>
  <!-- MIT bold text -->
  <text x="60" y="56" font-family="Arial Black, Arial, sans-serif" font-size="46" font-weight="900"
        fill="#0d1b4b" text-anchor="middle" letter-spacing="2">MIT</text>
  <!-- Horizontal rule -->
  <rect x="12" y="62" width="96" height="2.5" rx="1" fill="#0d1b4b"/>
  <!-- "Academy of" text -->
  <text x="60" y="82" font-family="Georgia, serif" font-size="13" font-weight="400"
        fill="#0d1b4b" text-anchor="middle">Academy of</text>
  <!-- "Engineering" text -->
  <text x="60" y="98" font-family="Georgia, serif" font-size="13" font-weight="400"
        fill="#0d1b4b" text-anchor="middle">Engineering</text>
</svg>
